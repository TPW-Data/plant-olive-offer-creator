async function doLogin(event){
  event.preventDefault();
  const u=document.getElementById("loginUsername").value.trim().toLowerCase();
  const p=document.getElementById("loginPassword").value;
  const err=document.getElementById("loginError");
  err.textContent="";
  if(supabaseReady){
    const email=SUPABASE_LOGIN_EMAILS[u];
    if(!email){err.textContent="Incorrect username or password.";return false;}
    const {error}=await sb.auth.signInWithPassword({email,password:p});
    if(error){err.textContent="Incorrect username or password.";return false;}
    showApp();
    await seedInitialOffer();
    await loadOffersFromCloud();
    return false;
  }
  if(u===LOGIN_USER && p===LOGIN_PASS){
    sessionStorage.setItem("plantOliveLoggedIn","1");
    showApp();
    return false;
  }
  err.textContent="Incorrect username or password.";
  document.getElementById("loginPassword").select();
  return false;
}
async function logout(){
  if(supabaseReady) await sb.auth.signOut();
  sessionStorage.removeItem("plantOliveLoggedIn");
  document.getElementById("loginUsername").value="";
  document.getElementById("loginPassword").value="";
  document.getElementById("loginError").textContent="";
  document.getElementById("loginOverlay").style.display="flex";
  document.body.classList.add("app-locked");
  document.getElementById("loginUsername").focus();
}

const E=n=>new Intl.NumberFormat("hr-HR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const N=n=>new Intl.NumberFormat("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true}).format(Number(n)||0);
const parseEU=v=>{
  if(v===null||v===undefined||v==="") return 0;
  let s=String(v).trim().replace(/\\s/g,"");
  if(s.includes(",")) s=s.replace(/\\./g,"").replace(",",".");
  else s=s.replace(/\\.(?=\\d{3}(?:\\D|$))/g,"");
  const n=Number(s);
  return Number.isFinite(n)?n:0;
};
const A=i=>(+i.qty||0)*(+i.price||0)*(1-(+i.discount||0)/100);
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");

function localDateString(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDaysToDateString(dateString,days=15){
  if(!dateString) return "";
  const parts=dateString.split("-").map(Number);
  if(parts.length!==3 || parts.some(Number.isNaN)) return "";
  const d=new Date(parts[0],parts[1]-1,parts[2]);
  d.setDate(d.getDate()+days);
  return localDateString(d);
}
function sync(){
  let m={no:"no",date:"date",valid:"valid",resp:"resp",customer:"customer",address:"address",title:"title"};
  for(const k in m){
    let x=document.getElementById(m[k]);
    x.value=o[k]||"";
    if(k==="date") x.oninput=()=>{ o.date=x.value; o.valid=addDaysToDateString(o.date,15); const v=document.getElementById("valid"); if(v) v.value=o.valid; };
    else if(k==="valid") { x.readOnly=true; x.title="Automatski: datum ponude + 15 dana"; }
    else if(k==="no") x.oninput=()=>{ x.value=x.value.replace(/\D/g,"").slice(0,4); o[k]=x.value; };
    else x.oninput=()=>o[k]=x.value;
  }
  if(o.date){
    o.valid=addDaysToDateString(o.date,15);
    const v=document.getElementById("valid"); if(v) v.value=o.valid;
  }
}
function newOffer(){
  const today=localDateString();
  o={id:Date.now(),no:"",date:today,valid:addDaysToDateString(today,15),resp:"",customer:"",address:"",title:"PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA",sections:[]};

function addSection(){o.sections.push({name:"",items:[]});render()}
function addItem(s){o.sections[s].items.push({desc:"",unit:"kom",qty:1,price:0,discount:0,vat:25});render()}

function stockMatch(item,term){
  const q=String(term||"").trim().toLocaleLowerCase("hr-HR");
  if(!q) return true;
  return String(item.sifra).toLocaleLowerCase("hr-HR").includes(q) || String(item.naziv).toLocaleLowerCase("hr-HR").includes(q);
}
function stockSuggestions(term){
  return STOCK_DATA.filter(x=>stockMatch(x,term)).slice(0,10);
}
function applyStockItem(targetItem,item){
  targetItem.desc=item.naziv;
  targetItem.unit=item.jm;
  targetItem.price=Number(item.vpc)||0;
  targetItem.vat=Number(item.porez)||0;
}
function showStockSuggestions(input,box,targetItem){
  const results=stockSuggestions(input.value);
  box.innerHTML="";
  if(!input.value.trim() || !results.length){box.classList.remove("open");return;}
  results.forEach(item=>{
    const d=document.createElement("div");
    d.className="stock-suggestion";
    d.innerHTML="<strong>"+esc(item.naziv)+"</strong><span>"+esc(item.sifra)+" • "+esc(item.jm)+" • VPC "+N(item.vpc)+" • PDV "+N(item.porez)+"%</span>";
    d.onmousedown=e=>{
      e.preventDefault();
      applyStockItem(targetItem,item);
      input.value=targetItem.desc;
      box.classList.remove("open");
      const tr=input.closest("tr");
      if(tr){
        tr.querySelector('[data-k="unit"]').value=targetItem.unit;
        tr.querySelector('[data-k="price"]').value=N(targetItem.price);
        tr.querySelector('[data-k="vat"]').value=N(targetItem.vat);
        const amountCell=tr.children[7];if(amountCell)amountCell.textContent=E(A(targetItem));
        const section=tr.closest(".section");
        if(section){const si=[...document.querySelectorAll(".section")].indexOf(section);if(si>=0){const st=section.querySelector(".section-total");if(st)st.textContent="UKUPNO: "+E(o.sections[si].items.reduce((sum,it)=>sum+A(it),0));}}
        updateSummaryOnly();
      }
    };
    box.appendChild(d);
  });
  box.classList.add("open");
}
function renderStockTable(term=""){
  const body=document.getElementById("stockTableBody"),count=document.getElementById("stockCount");
  if(!body)return;
  const rows=STOCK_DATA.filter(x=>stockMatch(x,term));
  body.innerHTML=rows.map((x,i)=>`<tr onclick="selectStockFromTable(${STOCK_DATA.indexOf(x)})">
    <td class="num">${x.rb}</td><td>${esc(x.sifra)}</td><td>${text(x.naziv)}</td>
    <td class="num">${N(x.stanje)}</td><td>${esc(x.jm)}</td><td class="num">${N(x.porez)}%</td><td class="num">${N(x.vpc)}</td>
  </tr>`).join("");
  count.textContent=rows.length+" of "+STOCK_DATA.length+" items • Click a row to use it in the active offer item.";
}
function selectStockFromTable(index){
  const item=STOCK_DATA[index];
  if(!item)return;
  if(window.activeStockTarget){
    applyStockItem(window.activeStockTarget,item);
    render();
    toggleStockPanel(false);
    window.activeStockTarget=null;
  }else{
    alert("First click in a Naziv field in an offer item, then open Stanje Zaliha to select an item.");
  }
}

}

function toggleStockPanel(open){

      tr.querySelectorAll("input").forEach(x=>{

        const numeric=!(["desc","unit"].includes(k));
        if(k==="desc"){
          const box=tr.querySelector(".stock-suggest");
          x.onfocus=()=>{window.activeStockTarget=it;showStockSuggestions(x,box,it);};
          x.oninput=()=>{window.activeStockTarget=it;it.desc=x.value;showStockSuggestions(x,box,it);};
          x.onblur=()=>setTimeout(()=>box.classList.remove("open"),180);
        }
        x.value=numeric?N(it[k]):it[k];
        x.style.textAlign="right";
        if(numeric){
          x.onfocus=()=>{ x.value=String(it[k] ?? "").replace(".",","); x.select(); };
        }
        x.oninput=()=>{
          it[k]=["desc","unit"].includes(k)?x.value:parseEU(x.value);
          const amountCell=tr.children[7];if(amountCell)amountCell.textContent=E(A(it));
          stTemp.textContent="UKUPNO: "+E(s.items.reduce((sum,item)=>sum+A(item),0));updateSummaryOnly();
        };
        if(numeric){
          x.onblur=()=>{ x.value=N(it[k]); };
        }
      });
      tr.querySelector("button").onclick=()=>{s.items.splice(ii,1);render()};tb.append(tr);
    });
    b.append(t);
    let ad=document.createElement("button");ad.className="add no-print";ad.textContent="+ Add Item";ad.onclick=()=>addItem(si);
    b.append(ad);b.append(stTemp);root.append(b);
  });
  updateSummaryOnly();
}
function updateSummaryOnly(){
  let bases={},vat=0,total=0;
  o.sections.forEach(sec=>sec.items.forEach(i=>{let a=A(i),v=+i.vat||0;bases[v]=(bases[v]||0)+a;vat+=a*v/100;total+=a}));
  let h="";
  Object.keys(bases).sort((a,b)=>a-b).forEach(v=>h+='<div class="sum"><span>OSNOVICA ZA PDV '+v+'%</span><b>'+E(bases[v])+'</b></div><div class="sum"><span>PDV '+v+'%</span><b>'+E(bases[v]*v/100)+'</b></div>');
  h+='<div class="sum"><span>UKUPNO OSNOVICA</span><b>'+E(total)+'</b></div><div class="sum"><span>UKUPNO PDV</span><b>'+E(vat)+'</b></div><div class="sum grand"><span>SVEUKUPNO</span><b>'+E(total+vat)+'</b></div>';
  document.getElementById("summary").innerHTML=h;
}
async function save(){
  o.no=String(o.no||"").replace(/\D/g,"").slice(0,4);
  document.getElementById("no").value=o.no;
  if(!/^\d{4}$/.test(o.no)){
    alert("Offer No. must contain exactly 4 digits (numbers only). Example: 2607");
    document.getElementById("no").focus();
    return;
  }
  if(supabaseReady){
    const {data:{user}}=await sb.auth.getUser();
    if(!user){alert("Please log in again.");return;}
    const {data:offerRow,error:offerError}=await sb.from("offers").upsert({
      id:o.id,
      offer_no:o.no||null,
      customer:o.customer||null,
      title:o.title||null,
      current_revision:o.revision||0,
      updated_at:new Date().toISOString(),
      created_by:user.id
    },{onConflict:"id"}).select().single();
    if(offerError){alert("Could not save offer: "+offerError.message);return;}
    const nextRevision=(offerRow.current_revision||0)+1;
    const {error:revError}=await sb.from("offer_revisions").insert({
      offer_id:o.id,
      revision_no:nextRevision,
      snapshot:o,
      created_by:user.id
    });
    if(revError){alert("Offer header was saved, but revision failed: "+revError.message);return;}
    await sb.from("offers").update({current_revision:nextRevision,updated_at:new Date().toISOString()}).eq("id",o.id);
    o.revision=nextRevision;
    alert("Offer saved as Revision "+nextRevision+".");
    await refreshOfferDirectory();
    return;
  }
  let a=JSON.parse(localStorage.getItem("poOffers")||"[]"),i=a.findIndex(x=>x.id===o.id);
  if(i>=0){o.revision=(o.revision||0)+1;a[i]=o}else{o.revision=1;a.push(o)}
  localStorage.setItem("poOffers",JSON.stringify(a));alert("Offer saved as Revision "+o.revision+" (local browser storage). Connect Supabase for cloud storage.");
  renderOfferDirectoryLocal();
}
async function openSaved(){
  await refreshOfferDirectory();
  const tree=document.getElementById("offerTree");
  if(tree) tree.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function loadRevision(offerId, revisionNo){
  if(!supabaseReady)return;
  const {data:rev,error}=await sb.from("offer_revisions").select("snapshot,revision_no").eq("offer_id",offerId).eq("revision_no",revisionNo).single();
  if(error){alert("Could not open Revision "+revisionNo+": "+error.message);return;}
  o=rev.snapshot;
  o.revision=rev.revision_no;
  render();
  await refreshOfferDirectory();
}

async function loadLatestOffer(offerId){
  if(!supabaseReady)return;
  const {data:rev,error}=await sb.from("offer_revisions").select("snapshot,revision_no").eq("offer_id",offerId).order("revision_no",{ascending:false}).limit(1).single();
  if(error){alert("Could not open offer: "+error.message);return;}
  o=rev.snapshot;o.revision=rev.revision_no;render();await refreshOfferDirectory();
}

function directoryOfferHtml(row,revisions){
  const expanded=true;
  const activeOffer=(o.id===row.id);
  const revHtml=revisions.map(r=>{
    const active=(o.id===row.id && Number(o.revision||0)===Number(r.revision_no));
    return `<div class="revision-row ${active?'active':''}" onclick="loadRevision(${Number(row.id)},${Number(r.revision_no)})" title="Open Revision ${Number(r.revision_no)}">
      <span class="revision-dot"></span><span>Revision ${Number(r.revision_no)}</span><span style="margin-left:auto;font-size:10px;color:#999">${new Date(r.created_at).toLocaleDateString('en-GB')}</span>
    </div>`;
  }).join("");
  return `<div class="offer-node">
    <div class="offer-row ${activeOffer?'active':''}" onclick="loadLatestOffer(${Number(row.id)})" title="Open latest revision">
      <span class="offer-arrow">▾</span><span class="offer-name">${esc(row.offer_no||'Draft')}<span class="offer-customer">${esc(row.customer||'No customer')}</span></span>
      <span style="font-size:10px;color:#888">R${Number(row.current_revision||0)}</span>
    </div>
    <div class="revision-list">${revHtml || '<div class="directory-empty">No revisions</div>'}</div>
  </div>`;
}

async function refreshOfferDirectory(){
  if(!supabaseReady){renderOfferDirectoryLocal();return;}
  const status=document.getElementById("directoryStatus"),tree=document.getElementById("offerTree");
  if(!tree)return;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){status.textContent="Please log in";tree.innerHTML="";return;}
  status.textContent="Loading offers...";
  const {data:rows,error}=await sb.from("offers").select("id,offer_no,customer,title,current_revision,updated_at").order("updated_at",{ascending:false});
  if(error){status.textContent="Could not load offers";tree.innerHTML='<div class="directory-empty">'+esc(error.message)+'</div>';return;}
  if(!rows?.length){status.textContent="No saved offers yet";tree.innerHTML='<div class="directory-empty">Save your first offer and it will appear here.</div>';return;}
  const ids=rows.map(r=>r.id);
  const {data:revs,error:revError}=await sb.from("offer_revisions").select("offer_id,revision_no,created_at").in("offer_id",ids).order("revision_no",{ascending:false});
  if(revError){status.textContent="Offers loaded";tree.innerHTML=rows.map(r=>directoryOfferHtml(r,[])).join("");return;}
  const byOffer={};(revs||[]).forEach(r=>{(byOffer[r.offer_id] ||= []).push(r)});
  status.textContent=rows.length+" offer"+(rows.length===1?'':'s');
  tree.innerHTML=rows.map(r=>directoryOfferHtml(r,byOffer[r.id]||[])).join("");
}

function renderOfferDirectoryLocal(){
  const status=document.getElementById("directoryStatus"),tree=document.getElementById("offerTree");if(!tree)return;
  const a=JSON.parse(localStorage.getItem("poOffers")||"[]");
  if(!a.length){status.textContent="No saved offers yet";tree.innerHTML='<div class="directory-empty">Save your first offer and it will appear here.</div>';return;}
  status.textContent=a.length+" offer"+(a.length===1?'':'s');
  tree.innerHTML=a.map(row=>{
    const active=o.id===row.id;
    const rev=Number(row.revision||1);
    return `<div class="offer-node"><div class="offer-row ${active?'active':''}" onclick="o=JSON.parse(JSON.stringify(window._localOffers.find(x=>x.id===${Number(row.id)})));render();renderOfferDirectoryLocal()"><span class="offer-arrow">▾</span><span class="offer-name">${esc(row.no||'Draft')}<span class="offer-customer">${esc(row.customer||'No customer')}</span></span><span style="font-size:10px;color:#888">R${rev}</span></div><div class="revision-list"><div class="revision-row ${active?'active':''}"><span class="revision-dot"></span><span>Revision ${rev}</span></div></div></div>`;
  }).join("");
  window._localOffers=a;
}

function loadOffersFromCloud(){
  if(supabaseReady) refreshOfferDirectory(); else renderOfferDirectoryLocal();
}

function preparePrint(){
  let bases={},vatTotal=0,total=0;
  o.sections.forEach(s=>s.items.forEach(i=>{
    let a=A(i),v=+i.vat||0;bases[v]=(bases[v]||0)+a;vatTotal+=a*v/100;total+=a;
  }));
  const logo=LOGO_DATA;
  let sectionsHtml="";
  o.sections.forEach((s,si)=>{
    let rows=s.items.map((it,ii)=>`<tr>
      <td>${ii+1}</td><td>${text(it.desc)}</td><td>${esc(it.unit)}</td>
      <td>${N(it.qty)}</td><td>${N(it.price)}</td><td>${N(it.discount)}%</td>
      <td>${N(it.vat)}%</td><td>${E(A(it))}</td>
    </tr>`).join("");
    let st=s.items.reduce((x,i)=>x+A(i),0);
    sectionsHtml+=`<div class="report-section">
      <div class="report-section-title">${si+1}. ${esc(s.name||"NEUNESENA STAVKA")}</div>
      <table class="report-table">
        <thead><tr><th>No.</th><th>Opis</th><th>JMJ</th><th>KOL</th><th>J.C.</th><th>POPUST</th><th>PDV</th><th>IZNOS bez PDV-a</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="section-total-print"><span>UKUPNO:&nbsp;&nbsp;${E(st)}</span></div>
    </div>`;
  });
  let vatRows="";
  Object.keys(bases).sort((a,b)=>a-b).forEach(v=>{
    vatRows+=`<div class="summary-row"><span>OSNOVICA ZA PDV ${v}% (EUR):</span><b>${E(bases[v])}</b></div>
    <div class="summary-row"><span>PDV ${v}% (EUR):</span><b>${E(bases[v]*v/100)}</b></div>`;
  });
  const address=o.address||"";
  document.getElementById("printReport").innerHTML=`<div class="report">
    <div class="report-header">
      <div class="report-logo"><img src="${logo}" alt="Plant Olive"></div>
      <div class="company"><strong>PLANT OLIVE d.o.o</strong><br>Put Devinke 8<br>23000, Briševo<br>Zadar, Croatia<br>OIB: HR17766224291</div>
    </div>
    <div class="meta">
      <div class="meta-left">
        <div><b>KUPAC:</b> ${esc(o.customer||"")}</div>
        <div><b>ADRESA:</b> ${esc(address)}</div>
      </div>
      <div class="meta-right">
        <div><b>PONUDA:</b> ${esc(o.no||"")}</div>
        <div><b>DATUM:</b> ${esc(o.date||"")}</div>
        <div><b>VRIJEDI DO:</b> ${esc(o.valid||"")}</div>
        <div><b>ODGOVORNA OSOBA:</b> ${esc(o.resp||"")}</div>
      </div>
    </div>
    <div class="report-title">${esc(o.title||"PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA")}</div>
    ${sectionsHtml}
    <div class="summary-wrap">
      <div class="summary-left">
        <div class="line">Suma svih troškova prema grupama radova nalazi se iznad.</div>
        <div class="line">Iznosi su iskazani u EUR i bez PDV-a, osim gdje je drugačije navedeno.</div>
      </div>
      <div class="summary-box">
        ${vatRows}
        <div class="summary-row total"><span>UKUPNO OSNOVICA (EUR):</span><b>${E(total)}</b></div>
        <div class="summary-row total"><span>UKUPNO PDV (EUR):</span><b>${E(vatTotal)}</b></div>
        <div class="summary-row grand"><span>SVEUKUPNO (EUR):</span><b>${E(total+vatTotal)}</b></div>
      </div>
    </div>
    <div class="footer">
      <div>
        <strong>PLANT OLIVE d.o.o</strong><br>
        Put Devinke 8<br>23000, Briševo<br>Zadar, Croatia<br>OIB: HR17766224291
      </div>
      <div class="footer-right">
        <strong>IBAN (EUR)</strong><br>
        RAIFFEISENBANK AUSTRIA d.d.<br>
        HR5524840081135346626
      </div>
    </div>
    <div class="page-note">Plant Olive — Offer</div>
  </div>`;
}
function createPDF(){
  preparePrint();
  setTimeout(()=>window.print(),80);
}
const screenLogo=document.getElementById("screenLogo");
const loginLogo=document.getElementById("loginLogo");
if(screenLogo) screenLogo.src=LOGO_DATA;
if(loginLogo) loginLogo.src=LOGO_DATA;
if(supabaseReady){
  sb.auth.getSession().then(async ({data:{session}})=>{
    if(session){showApp();await loadOffersFromCloud();}
  });
}else if(sessionStorage.getItem("plantOliveLoggedIn")==="1") showApp();
newOffer();
setTimeout(()=>loadOffersFromCloud(),100);

initStockSearch();

</script>
