<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Olive Offer Creator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f7;color:#24222a;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:9px 13px}.top{background:#fff;border-bottom:1px solid #ddd;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:700;font-size:19px;color:#68705d}.actions{display:flex;gap:8px}.primary{background:#68705d;color:#fff}.secondary{background:#eee}.wrap{max-width:1450px;margin:20px auto;padding:0 16px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;color:#666;margin-bottom:4px}.field input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px}h2{font-size:16px;margin:0 0 14px}.section{border:1px solid #aaa;margin-top:16px}.section-title{background:#d9d2e9;padding:9px;display:flex;gap:8px;align-items:center;font-weight:700}.section-title input{flex:1;border:0;background:transparent;font-weight:700;outline:0}.section-title button{padding:4px 8px;background:#fff8}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #c8c8c8;padding:6px;font-size:12px}th{background:#d9d2e9}th:nth-child(1){width:48px}th:nth-child(2){width:34%}th:nth-child(3){width:70px}th:nth-child(4){width:75px}th:nth-child(5){width:95px}th:nth-child(6){width:80px}th:nth-child(7){width:70px}th:nth-child(8){width:120px}th:nth-child(9){width:40px}td input{width:100%;border:0;outline:0;background:transparent}.money{text-align:right}.section-total{text-align:right;font-weight:700;background:#f0edf5;padding:8px}.add{margin:8px;background:#eee}.summary{max-width:600px;margin-left:auto}.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd}.grand{font-size:18px;font-weight:700;padding-top:10px}.muted{font-size:12px;color:#777}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media print{.no-print,.top{display:none!important}body{background:#fff}.wrap{margin:0;padding:0;max-width:none}.card{border:0;padding:0;box-shadow:none}.section-title,th{print-color-adjust:exact;-webkit-print-color-adjust:exact}@page{size:A4 portrait;margin:10mm}}
</style></head><body>
<div class="top no-print"><div class="brand">PLANT OLIVE — OFFER CREATOR</div><div class="actions"><button class="secondary" onclick="newOffer()">New</button><button class="secondary" onclick="openSaved()">Open</button><button class="secondary" onclick="save()">Save</button><button class="primary" onclick="print()">CREATE PDF</button></div></div>
<div class="wrap"><div class="card"><h2>Offer Information</h2><div class="grid">
<div class="field"><label>Offer No.</label><input id="no"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Valid Until</label><input id="valid" type="date"></div><div class="field"><label>Responsible Person</label><input id="resp"></div>
<div class="field"><label>Customer</label><input id="customer"></div><div class="field"><label>Customer Address</label><input id="address"></div><div class="field" style="grid-column:span 2"><label>Offer Title</label><input id="title" value="PONUDA"></div>
</div></div>
<div class="card"><h2>Offer Items</h2><div id="sections"></div><button class="primary no-print" onclick="addSection()">+ Add Headline</button><p class="muted no-print">Create main headlines first, then add priced subitems.</p></div>
<div class="card summary"><h2>VAT Summary</h2><div id="summary"></div></div></div>
<script>
let o={id:Date.now(),no:"",date:new Date().toISOString().slice(0,10),valid:"",resp:"",customer:"",address:"",title:"PONUDA",sections:[]};
const E=n=>new Intl.NumberFormat("hr-HR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const A=i=>(+i.qty||0)*(+i.price||0)*(1-(+i.discount||0)/100);
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
function sync(){let m={no:"no",date:"date",valid:"valid",resp:"resp",customer:"customer",address:"address",title:"title"};for(const k in m){let x=document.getElementById(m[k]);x.value=o[k]||"";x.oninput=()=>o[k]=x.value}}
function newOffer(){o={id:Date.now(),no:"",date:new Date().toISOString().slice(0,10),valid:"",resp:"",customer:"",address:"",title:"PONUDA",sections:[]};addSection()}
function addSection(){o.sections.push({name:"",items:[]});render()}
function addItem(s){o.sections[s].items.push({desc:"",unit:"kom",qty:1,price:0,discount:0,vat:25});render()}
function render(){sync();let root=document.getElementById("sections");root.innerHTML="";
o.sections.forEach((s,si)=>{let b=document.createElement("div");b.className="section";b.innerHTML='<div class="section-title"><input placeholder="MAIN HEADLINE"><button class="no-print">✕</button></div>';
let head=b.querySelector("input");head.value=s.name;head.oninput=()=>s.name=head.value;b.querySelector("button").onclick=()=>{o.sections.splice(si,1);render()};
let t=document.createElement("table");t.innerHTML="<thead><tr><th>No.</th><th>Description</th><th>JMJ</th><th>KOL</th><th>J.C.</th><th>Popust %</th><th>PDV %</th><th>IZNOS bez PDV-a</th><th></th></tr></thead><tbody></tbody>";let tb=t.querySelector("tbody");
s.items.forEach((it,ii)=>{let tr=document.createElement("tr");tr.innerHTML='<td>'+(ii+1)+'</td><td><input data-k="desc"></td><td><input data-k="unit"></td><td><input type="number" data-k="qty"></td><td><input type="number" step="0.01" data-k="price"></td><td><input type="number" step="0.01" data-k="discount"></td><td><input type="number" step="0.01" data-k="vat"></td><td class="money">'+E(A(it))+'</td><td><button class="no-print">✕</button></td>';
tr.querySelectorAll("input").forEach(x=>{
  let k=x.dataset.k;
  x.value=it[k];
  x.oninput=()=>{
    it[k]=["desc","unit"].includes(k)?x.value:+x.value;
    const amountCell=tr.children[7];
    if(amountCell) amountCell.textContent=E(A(it));
    const total=s.items.reduce((sum,item)=>sum+A(item),0);
    stTemp.textContent="UKUPNO: "+E(total);
    updateSummaryOnly();
  };
});
tr.querySelector("button").onclick=()=>{s.items.splice(ii,1);render()};
tb.append(tr)});b.append(t);
let stTemp=document.createElement("div");
stTemp.className="section-total";
stTemp.textContent="UKUPNO: "+E(s.items.reduce((x,i)=>x+A(i),0));
let ad=document.createElement("button");ad.className="add no-print";ad.textContent="+ Add Item";ad.onclick=()=>addItem(si);b.append(ad);b.append(stTemp);root.append(b)});
let bases={},vat=0,total=0;o.sections.forEach(s=>s.items.forEach(i=>{let a=A(i),v=+i.vat||0;bases[v]=(bases[v]||0)+a;vat+=a*v/100;total+=a}));let h="";Object.keys(bases).sort((a,b)=>a-b).forEach(v=>{h+='<div class="sum"><span>OSNOVICA ZA PDV '+v+'%</span><b>'+E(bases[v])+'</b></div><div class="sum"><span>PDV '+v+'%</span><b>'+E(bases[v]*v/100)+'</b></div>'});h+='<div class="sum"><span>UKUPNO OSNOVICA</span><b>'+E(total)+'</b></div><div class="sum"><span>UKUPNO PDV</span><b>'+E(vat)+'</b></div><div class="sum grand"><span>SVEUKUPNO</span><b>'+E(total+vat)+'</b></div>';document.getElementById("summary").innerHTML=h}
function updateSummaryOnly(){
  let bases={},vat=0,total=0;
  o.sections.forEach(sec=>sec.items.forEach(i=>{
    let a=A(i),v=+i.vat||0;
    bases[v]=(bases[v]||0)+a;
    vat+=a*v/100;
    total+=a;
  }));
  let h="";
  Object.keys(bases).sort((a,b)=>a-b).forEach(v=>{
    h+='<div class="sum"><span>OSNOVICA ZA PDV '+v+'%</span><b>'+E(bases[v])+'</b></div><div class="sum"><span>PDV '+v+'%</span><b>'+E(bases[v]*v/100)+'</b></div>';
  });
  h+='<div class="sum"><span>UKUPNO OSNOVICA</span><b>'+E(total)+'</b></div><div class="sum"><span>UKUPNO PDV</span><b>'+E(vat)+'</b></div><div class="sum grand"><span>SVEUKUPNO</span><b>'+E(total+vat)+'</b></div>';
  document.getElementById("summary").innerHTML=h;
}
function save(){let a=JSON.parse(localStorage.getItem("poOffers")||"[]"),i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);localStorage.setItem("poOffers",JSON.stringify(a));alert("Offer saved.");}
function openSaved(){let a=JSON.parse(localStorage.getItem("poOffers")||"[]");if(!a.length)return alert("No saved offers.");let msg=a.map((x,i)=>(i+1)+". "+(x.no||"Draft")+" — "+(x.customer||"No customer")).join("\n");let n=prompt(msg+"\n\nEnter number:");if(n&&a[+n-1]){o=a[+n-1];render()}}
newOffer();
</script></body></html>
