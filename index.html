<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Olive Offer Creator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f3f5;color:#25252a;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:9px 13px}
.top{background:#fff;border-bottom:1px solid #ddd;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:19px;color:#4f633e}
.actions{display:flex;gap:8px}
.primary{background:#4f633e;color:#fff}
.secondary{background:#eee;color:#222}
.wrap{max-width:1450px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field label{display:block;font-size:12px;color:#666;margin-bottom:4px}
.field input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px}
h2{font-size:16px;margin:0 0 14px}
.section{border:1px solid #aaa;margin-top:16px;background:#fff}
.section-title{background:#d9d2e9;padding:9px;display:flex;gap:8px;align-items:center;font-weight:700}
.section-title input{flex:1;border:0;background:transparent;font-weight:700;outline:0}
.section-title button{padding:4px 8px;background:#fff8}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #c8c8c8;padding:6px;font-size:12px}
th{background:#d9d2e9}
th:nth-child(1){width:48px} th:nth-child(2){width:34%} th:nth-child(3){width:70px} th:nth-child(4){width:75px} th:nth-child(5){width:95px} th:nth-child(6){width:80px} th:nth-child(7){width:70px} th:nth-child(8){width:120px} th:nth-child(9){width:40px}
td input{width:100%;border:0;outline:0;background:transparent}
.money{text-align:right}
.section-total{text-align:right;font-weight:700;background:#f0edf5;padding:8px}
.add{margin:8px;background:#eee}
.summary{max-width:600px;margin-left:auto}
.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd}
.grand{font-size:18px;font-weight:700;padding-top:10px}
.muted{font-size:12px;color:#777}
.print-report{display:none}

/* PRINT REPORT */
@media print{
  body{background:#fff}
  .no-print,.top,.editor{display:none!important}
  .print-report{display:block}
  @page{size:A4 portrait;margin:10mm 9mm 12mm 9mm}
}
.report{font-family:Arial,Helvetica,sans-serif;color:#25252a;font-size:9px}
.report-header{display:grid;grid-template-columns:52% 48%;min-height:92px;border-bottom:2px solid #4f633e;padding-bottom:9px;margin-bottom:10px}
.report-logo{display:flex;align-items:center}
.report-logo img{width:255px;height:auto;max-height:82px;object-fit:contain;object-position:left center}
.company{text-align:right;line-height:1.35;font-size:8.5px;padding-top:3px}
.company strong{font-size:10px;color:#394b2e}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin:0 0 10px 0}
.meta-left,.meta-right{line-height:1.45}
.meta-right{text-align:right}
.meta b{font-weight:700}
.report-title{font-size:13px;font-weight:700;letter-spacing:.2px;color:#394b2e;margin:4px 0 9px;text-transform:uppercase}
.report-section{margin-top:9px;break-inside:auto}
.report-section-title{background:#b9b4d2;color:#1f2130;font-weight:700;padding:5px 6px;border:1px solid #777;letter-spacing:.1px}
.report-table{width:100%;border-collapse:collapse;table-layout:fixed}
.report-table thead{display:table-header-group}
.report-table tr{break-inside:avoid}
.report-table th,.report-table td{border:1px solid #8d8d8d;padding:3.5px 4px;font-size:8px;line-height:1.15;vertical-align:top}
.report-table th{background:#d8d4e6;font-weight:700;text-align:center;vertical-align:middle}
.report-table th:nth-child(1){width:5%}
.report-table th:nth-child(2){width:44%}
.report-table th:nth-child(3){width:7%}
.report-table th:nth-child(4){width:8%}
.report-table th:nth-child(5){width:9%}
.report-table th:nth-child(6){width:8%}
.report-table th:nth-child(7){width:7%}
.report-table th:nth-child(8){width:12%}
.report-table td:nth-child(1),.report-table td:nth-child(3),.report-table td:nth-child(4),.report-table td:nth-child(5),.report-table td:nth-child(6),.report-table td:nth-child(7){text-align:center}
.report-table td:nth-child(8){text-align:right;white-space:nowrap}
.section-total-print{display:flex;justify-content:flex-end;border:1px solid #777;border-top:0;background:#f0eef4;font-weight:700;padding:4px 6px;font-size:8.5px}
.summary-wrap{margin-top:12px;display:grid;grid-template-columns:1fr 47%;gap:16px;align-items:end;break-inside:avoid}
.summary-left{font-size:8px;line-height:1.5}
.summary-left .line{border-bottom:1px solid #ddd;padding:2px 0}
.summary-box{border:1.2px solid #555}
.summary-row{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px solid #aaa;font-size:8.5px}
.summary-row:last-child{border-bottom:0}
.summary-row.grand{font-size:10px;font-weight:700;background:#dfe6d9;color:#27351e}
.summary-row.total{font-weight:700;background:#f0eef4}
.footer{margin-top:12px;border-top:1px solid #777;padding-top:6px;display:grid;grid-template-columns:1fr 1fr;font-size:7.8px;line-height:1.35;break-inside:avoid}
.footer-right{text-align:right}
.page-note{text-align:center;color:#777;font-size:7px;margin-top:7px}
@media screen{.print-report{max-width:210mm;margin:25px auto;background:#fff;padding:10mm;box-shadow:0 2px 12px #0002}}

.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#eef1eb,#f7f4f8);display:flex;align-items:center;justify-content:center;z-index:99999}.login-box{width:min(420px,92vw);background:#fff;border:1px solid #ddd;border-radius:16px;padding:34px;box-shadow:0 12px 40px #0002;text-align:left}.login-logo{display:block;max-width:250px;max-height:90px;margin:0 auto 24px;object-fit:contain}.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}.login-subtitle{text-align:center;color:#777;font-size:13px;margin-bottom:24px}.login-field{margin-bottom:14px}.login-field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.login-field input{width:100%;padding:12px;border:1px solid #cfcfcf;border-radius:8px;outline:none}.login-field input:focus{border-color:#68705d;box-shadow:0 0 0 2px #68705d22}.login-btn{width:100%;padding:12px;background:#68705d;color:#fff;font-weight:700}.login-error{min-height:18px;color:#b42318;font-size:12px;text-align:center;margin:10px 0}.logout-btn{background:#eee;color:#333}.app-locked{overflow:hidden}

.offer-directory{position:fixed;left:0;top:73px;bottom:0;width:292px;background:#fff;border-right:1px solid #ddd;overflow:auto;padding:16px 12px;z-index:4}.offer-directory h3{margin:2px 6px 12px;font-size:15px;color:#394b2e}.directory-status{font-size:11px;color:#888;padding:0 6px 10px}.offer-tree{font-size:13px}.offer-node{margin-bottom:5px}.offer-row{display:flex;align-items:center;gap:5px;padding:8px 7px;border-radius:7px;cursor:pointer}.offer-row:hover{background:#f2f4ef}.offer-row.active{background:#e7ecdf}.offer-arrow{width:18px;color:#68705d;font-size:11px;text-align:center}.offer-name{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.offer-customer{display:block;font-size:11px;color:#777;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.revision-list{margin-left:24px;border-left:1px solid #ddd;padding-left:8px}.revision-row{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;cursor:pointer;color:#555}.revision-row:hover{background:#f5f5f5;color:#222}.revision-row.active{background:#eef1eb;color:#394b2e;font-weight:700}.revision-dot{width:6px;height:6px;border-radius:50%;background:#a7b39a;flex:0 0 auto}.directory-empty{font-size:12px;color:#888;padding:12px 6px}.editor.wrap{margin-left:312px;margin-right:18px;max-width:none}.directory-refresh{float:right;padding:4px 7px;background:#eee;border-radius:5px;font-size:11px}
@media(max-width:900px){.offer-directory{position:static;width:auto;height:auto;max-height:260px;border-right:0;border-bottom:1px solid #ddd;margin:0 8px 12px;border-radius:8px}.editor.wrap{margin:12px 8px;max-width:none}.offer-directory h3{margin-top:0}}
@media print{.offer-directory{display:none!important}.editor.wrap{margin:0!important;max-width:none!important}}
</style>
</head>
<body class="app-locked">
<div id="loginOverlay" class="login-overlay no-print">
  <form class="login-box" onsubmit="return doLogin(event)">
    <img id="loginLogo" class="login-logo" alt="Plant Olive">
    <div class="login-title">Plant Olive Offer Creator</div>
    <div class="login-subtitle">Please sign in to continue</div>
    <div class="login-field"><label>Username</label><input id="loginUsername" autocomplete="username" autofocus></div>
    <div class="login-field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <div id="loginError" class="login-error"></div>
    <button class="login-btn" type="submit">LOGIN</button>
  </form>
</div>

<div class="top no-print">
  <div class="brand"><span style="display:inline-flex;align-items:center;gap:10px"><img id="screenLogo" alt="Plant Olive" style="height:42px;width:auto;object-fit:contain"><span>OFFER CREATOR</span></span></div>
  <div class="actions">
    <button class="secondary" onclick="newOffer()">New</button>
    <button class="secondary" onclick="openSaved()">Open</button>
    <button class="secondary" onclick="save()">Save</button>
    <button class="primary" onclick="createPDF()">CREATE PDF</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<aside id="offerDirectory" class="offer-directory no-print">
  <h3>Saved Offers <button class="directory-refresh" onclick="refreshOfferDirectory()">↻</button></h3>
  <div id="directoryStatus" class="directory-status">Loading...</div>
  <div id="offerTree" class="offer-tree"></div>
</aside>

<div class="wrap editor">
  <div class="card">
    <h2>Offer Information</h2>
    <div class="grid">
      <div class="field"><label>Offer No.</label><input id="no"></div>
      <div class="field"><label>Date</label><input id="date" type="date"></div>
      <div class="field"><label>Valid Until</label><input id="valid" type="date"></div>
      <div class="field"><label>Responsible Person</label><input id="resp"></div>
      <div class="field"><label>Customer</label><input id="customer"></div>
      <div class="field"><label>Customer Address</label><input id="address"></div>
      <div class="field" style="grid-column:span 2"><label>Offer Title</label><input id="title" value="PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA"></div>
    </div>
  </div>
  <div class="card">
    <h2>Offer Items</h2>
    <div id="sections"></div>
    <button class="primary no-print" onclick="addSection()">+ Add Headline</button>
    <p class="muted no-print">Create main headlines first, then add priced subitems.</p>
  </div>
  <div class="card summary">
    <h2>VAT Summary</h2>
    <div id="summary"></div>
  </div>
</div>

<div id="printReport" class="print-report"></div>

<script>
const SUPABASE_URL="https://vsmxadujfwonsxsrcepf.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HA_KN4AStZsStOvNcefZGQ_OBmhF_1X";
const SUPABASE_LOGIN_EMAILS={maris:"maris@plant-olive.com"};
const supabaseReady=!!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
const sb=supabaseReady ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
const LOGIN_USER="maris";
const LOGIN_PASS="plantolive";

function showApp(){
  const overlay=document.getElementById("loginOverlay");
  if(overlay) overlay.style.display="none";
  document.body.classList.remove("app-locked");
}
async function doLogin(event){
  event.preventDefault();
  const u=document.getElementById("loginUsername").value.trim().toLowerCase();
  const p=document.getElementById("loginPassword").value;
  const err=document.getElementById("loginError");
  err.textContent="";
  if(supabaseReady){
    const email=SUPABASE_LOGIN_EMAILS[u];
    if(!email){err.textContent="Incorrect username or password.";return false;}
    const {error}=await sb.auth.signInWithPassword({email,password:p});
    if(error){err.textContent="Incorrect username or password.";return false;}
    showApp();
    await loadOffersFromCloud();
    return false;
  }
  if(u===LOGIN_USER && p===LOGIN_PASS){
    sessionStorage.setItem("plantOliveLoggedIn","1");
    showApp();
    return false;
  }
  err.textContent="Incorrect username or password.";
  document.getElementById("loginPassword").select();
  return false;
}
async function logout(){
  if(supabaseReady) await sb.auth.signOut();
  sessionStorage.removeItem("plantOliveLoggedIn");
  document.getElementById("loginUsername").value="";
  document.getElementById("loginPassword").value="";
  document.getElementById("loginError").textContent="";
  document.getElementById("loginOverlay").style.display="flex";
  document.body.classList.add("app-locked");
  document.getElementById("loginUsername").focus();
}

let o={id:Date.now(),no:"",date:new Date().toISOString().slice(0,10),valid:"",resp:"",customer:"",address:"",title:"PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA",sections:[]};
const E=n=>new Intl.NumberFormat("hr-HR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const N=n=>new Intl.NumberFormat("hr-HR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const A=i=>(+i.qty||0)*(+i.price||0)*(1-(+i.discount||0)/100);
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const text=s=>esc(s).replaceAll("\n","<br>");

function sync(){
  let m={no:"no",date:"date",valid:"valid",resp:"resp",customer:"customer",address:"address",title:"title"};
  for(const k in m){let x=document.getElementById(m[k]);x.value=o[k]||"";x.oninput=()=>o[k]=x.value}
}
function newOffer(){
  o={id:Date.now(),no:"",date:new Date().toISOString().slice(0,10),valid:"",resp:"",customer:"",address:"",title:"PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA",sections:[]};
  addSection();
}
function addSection(){o.sections.push({name:"",items:[]});render()}
function addItem(s){o.sections[s].items.push({desc:"",unit:"kom",qty:1,price:0,discount:0,vat:25});render()}

function render(){
  sync();
  let root=document.getElementById("sections");root.innerHTML="";
  o.sections.forEach((s,si)=>{
    let b=document.createElement("div");b.className="section";
    b.innerHTML='<div class="section-title"><input placeholder="MAIN HEADLINE"><button class="no-print">✕</button></div>';
    let head=b.querySelector("input");head.value=s.name;head.oninput=()=>s.name=head.value;
    b.querySelector("button").onclick=()=>{o.sections.splice(si,1);render()};
    let t=document.createElement("table");
    t.innerHTML="<thead><tr><th>No.</th><th>Description</th><th>JMJ</th><th>KOL</th><th>J.C.</th><th>Popust %</th><th>PDV %</th><th>IZNOS bez PDV-a</th><th></th></tr></thead><tbody></tbody>";
    let tb=t.querySelector("tbody");
    let stTemp=document.createElement("div");stTemp.className="section-total";
    stTemp.textContent="UKUPNO: "+E(s.items.reduce((x,i)=>x+A(i),0));
    s.items.forEach((it,ii)=>{
      let tr=document.createElement("tr");
      tr.innerHTML='<td>'+(ii+1)+'</td><td><input data-k="desc"></td><td><input data-k="unit"></td><td><input type="number" step="0.001" data-k="qty"></td><td><input type="number" step="0.01" data-k="price"></td><td><input type="number" step="0.01" data-k="discount"></td><td><input type="number" step="0.01" data-k="vat"></td><td class="money">'+E(A(it))+'</td><td><button class="no-print">✕</button></td>';
      tr.querySelectorAll("input").forEach(x=>{
        let k=x.dataset.k;x.value=it[k];
        x.oninput=()=>{it[k]=["desc","unit"].includes(k)?x.value:+x.value;
          const amountCell=tr.children[7];if(amountCell)amountCell.textContent=E(A(it));
          stTemp.textContent="UKUPNO: "+E(s.items.reduce((sum,item)=>sum+A(item),0));updateSummaryOnly();};
      });
      tr.querySelector("button").onclick=()=>{s.items.splice(ii,1);render()};tb.append(tr);
    });
    b.append(t);
    let ad=document.createElement("button");ad.className="add no-print";ad.textContent="+ Add Item";ad.onclick=()=>addItem(si);
    b.append(ad);b.append(stTemp);root.append(b);
  });
  updateSummaryOnly();
}
function updateSummaryOnly(){
  let bases={},vat=0,total=0;
  o.sections.forEach(sec=>sec.items.forEach(i=>{let a=A(i),v=+i.vat||0;bases[v]=(bases[v]||0)+a;vat+=a*v/100;total+=a}));
  let h="";
  Object.keys(bases).sort((a,b)=>a-b).forEach(v=>h+='<div class="sum"><span>OSNOVICA ZA PDV '+v+'%</span><b>'+E(bases[v])+'</b></div><div class="sum"><span>PDV '+v+'%</span><b>'+E(bases[v]*v/100)+'</b></div>');
  h+='<div class="sum"><span>UKUPNO OSNOVICA</span><b>'+E(total)+'</b></div><div class="sum"><span>UKUPNO PDV</span><b>'+E(vat)+'</b></div><div class="sum grand"><span>SVEUKUPNO</span><b>'+E(total+vat)+'</b></div>';
  document.getElementById("summary").innerHTML=h;
}
async function save(){
  if(supabaseReady){
    const {data:{user}}=await sb.auth.getUser();
    if(!user){alert("Please log in again.");return;}
    const {data:offerRow,error:offerError}=await sb.from("offers").upsert({
      id:o.id,
      offer_no:o.no||null,
      customer:o.customer||null,
      title:o.title||null,
      current_revision:o.revision||0,
      updated_at:new Date().toISOString(),
      created_by:user.id
    },{onConflict:"id"}).select().single();
    if(offerError){alert("Could not save offer: "+offerError.message);return;}
    const nextRevision=(offerRow.current_revision||0)+1;
    const {error:revError}=await sb.from("offer_revisions").insert({
      offer_id:o.id,
      revision_no:nextRevision,
      snapshot:o,
      created_by:user.id
    });
    if(revError){alert("Offer header was saved, but revision failed: "+revError.message);return;}
    await sb.from("offers").update({current_revision:nextRevision,updated_at:new Date().toISOString()}).eq("id",o.id);
    o.revision=nextRevision;
    alert("Offer saved as Revision "+nextRevision+".");
    await refreshOfferDirectory();
    return;
  }
  let a=JSON.parse(localStorage.getItem("poOffers")||"[]"),i=a.findIndex(x=>x.id===o.id);
  if(i>=0){o.revision=(o.revision||0)+1;a[i]=o}else{o.revision=1;a.push(o)}
  localStorage.setItem("poOffers",JSON.stringify(a));alert("Offer saved as Revision "+o.revision+" (local browser storage). Connect Supabase for cloud storage.");
  renderOfferDirectoryLocal();
}
async function openSaved(){
  await refreshOfferDirectory();
  const tree=document.getElementById("offerTree");
  if(tree) tree.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function loadRevision(offerId, revisionNo){
  if(!supabaseReady)return;
  const {data:rev,error}=await sb.from("offer_revisions").select("snapshot,revision_no").eq("offer_id",offerId).eq("revision_no",revisionNo).single();
  if(error){alert("Could not open Revision "+revisionNo+": "+error.message);return;}
  o=rev.snapshot;
  o.revision=rev.revision_no;
  render();
  await refreshOfferDirectory();
}

async function loadLatestOffer(offerId){
  if(!supabaseReady)return;
  const {data:rev,error}=await sb.from("offer_revisions").select("snapshot,revision_no").eq("offer_id",offerId).order("revision_no",{ascending:false}).limit(1).single();
  if(error){alert("Could not open offer: "+error.message);return;}
  o=rev.snapshot;o.revision=rev.revision_no;render();await refreshOfferDirectory();
}

function directoryOfferHtml(row,revisions){
  const expanded=true;
  const activeOffer=(o.id===row.id);
  const revHtml=revisions.map(r=>{
    const active=(o.id===row.id && Number(o.revision||0)===Number(r.revision_no));
    return `<div class="revision-row ${active?'active':''}" onclick="loadRevision(${Number(row.id)},${Number(r.revision_no)})" title="Open Revision ${Number(r.revision_no)}">
      <span class="revision-dot"></span><span>Revision ${Number(r.revision_no)}</span><span style="margin-left:auto;font-size:10px;color:#999">${new Date(r.created_at).toLocaleDateString('en-GB')}</span>
    </div>`;
  }).join("");
  return `<div class="offer-node">
    <div class="offer-row ${activeOffer?'active':''}" onclick="loadLatestOffer(${Number(row.id)})" title="Open latest revision">
      <span class="offer-arrow">▾</span><span class="offer-name">${esc(row.offer_no||'Draft')}<span class="offer-customer">${esc(row.customer||'No customer')}</span></span>
      <span style="font-size:10px;color:#888">R${Number(row.current_revision||0)}</span>
    </div>
    <div class="revision-list">${revHtml || '<div class="directory-empty">No revisions</div>'}</div>
  </div>`;
}

async function refreshOfferDirectory(){
  if(!supabaseReady){renderOfferDirectoryLocal();return;}
  const status=document.getElementById("directoryStatus"),tree=document.getElementById("offerTree");
  if(!tree)return;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){status.textContent="Please log in";tree.innerHTML="";return;}
  status.textContent="Loading offers...";
  const {data:rows,error}=await sb.from("offers").select("id,offer_no,customer,title,current_revision,updated_at").order("updated_at",{ascending:false});
  if(error){status.textContent="Could not load offers";tree.innerHTML='<div class="directory-empty">'+esc(error.message)+'</div>';return;}
  if(!rows?.length){status.textContent="No saved offers yet";tree.innerHTML='<div class="directory-empty">Save your first offer and it will appear here.</div>';return;}
  const ids=rows.map(r=>r.id);
  const {data:revs,error:revError}=await sb.from("offer_revisions").select("offer_id,revision_no,created_at").in("offer_id",ids).order("revision_no",{ascending:false});
  if(revError){status.textContent="Offers loaded";tree.innerHTML=rows.map(r=>directoryOfferHtml(r,[])).join("");return;}
  const byOffer={};(revs||[]).forEach(r=>{(byOffer[r.offer_id] ||= []).push(r)});
  status.textContent=rows.length+" offer"+(rows.length===1?'':'s');
  tree.innerHTML=rows.map(r=>directoryOfferHtml(r,byOffer[r.id]||[])).join("");
}

function renderOfferDirectoryLocal(){
  const status=document.getElementById("directoryStatus"),tree=document.getElementById("offerTree");if(!tree)return;
  const a=JSON.parse(localStorage.getItem("poOffers")||"[]");
  if(!a.length){status.textContent="No saved offers yet";tree.innerHTML='<div class="directory-empty">Save your first offer and it will appear here.</div>';return;}
  status.textContent=a.length+" offer"+(a.length===1?'':'s');
  tree.innerHTML=a.map(row=>{
    const active=o.id===row.id;
    const rev=Number(row.revision||1);
    return `<div class="offer-node"><div class="offer-row ${active?'active':''}" onclick="o=JSON.parse(JSON.stringify(window._localOffers.find(x=>x.id===${Number(row.id)})));render();renderOfferDirectoryLocal()"><span class="offer-arrow">▾</span><span class="offer-name">${esc(row.no||'Draft')}<span class="offer-customer">${esc(row.customer||'No customer')}</span></span><span style="font-size:10px;color:#888">R${rev}</span></div><div class="revision-list"><div class="revision-row ${active?'active':''}"><span class="revision-dot"></span><span>Revision ${rev}</span></div></div></div>`;
  }).join("");
  window._localOffers=a;
}

function loadOffersFromCloud(){
  if(supabaseReady) refreshOfferDirectory(); else renderOfferDirectoryLocal();
}

function preparePrint(){

  o.sections.forEach(s=>s.items.forEach(i=>{
    let a=A(i),v=+i.vat||0;bases[v]=(bases[v]||0)+a;vatTotal+=a*v/100;total+=a;
  }));
  const logo=LOGO_DATA;
  let sectionsHtml="";
  o.sections.forEach((s,si)=>{
    let rows=s.items.map((it,ii)=>`<tr>
      <td>${ii+1}</td><td>${text(it.desc)}</td><td>${esc(it.unit)}</td>
      <td>${N(it.qty)}</td><td>${N(it.price)}</td><td>${N(it.discount)}%</td>
      <td>${N(it.vat)}%</td><td>${E(A(it))}</td>
    </tr>`).join("");
    let st=s.items.reduce((x,i)=>x+A(i),0);
    sectionsHtml+=`<div class="report-section">
      <div class="report-section-title">${si+1}. ${esc(s.name||"NEUNESENA STAVKA")}</div>
      <table class="report-table">
        <thead><tr><th>No.</th><th>Opis</th><th>JMJ</th><th>KOL</th><th>J.C.</th><th>POPUST</th><th>PDV</th><th>IZNOS bez PDV-a</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="section-total-print"><span>UKUPNO:&nbsp;&nbsp;${E(st)}</span></div>
    </div>`;
  });
  let vatRows="";
  Object.keys(bases).sort((a,b)=>a-b).forEach(v=>{
    vatRows+=`<div class="summary-row"><span>OSNOVICA ZA PDV ${v}% (EUR):</span><b>${E(bases[v])}</b></div>
    <div class="summary-row"><span>PDV ${v}% (EUR):</span><b>${E(bases[v]*v/100)}</b></div>`;
  });
  const address=o.address||"";
  document.getElementById("printReport").innerHTML=`<div class="report">
    <div class="report-header">
      <div class="report-logo"><img src="${logo}" alt="Plant Olive"></div>
      <div class="company"><strong>PLANT OLIVE d.o.o</strong><br>Put Devinke 8<br>23000, Briševo<br>Zadar, Croatia<br>OIB: HR17766224291</div>
    </div>
    <div class="meta">
      <div class="meta-left">
        <div><b>KUPAC:</b> ${esc(o.customer||"")}</div>
        <div><b>ADRESA:</b> ${esc(address)}</div>
      </div>
      <div class="meta-right">
        <div><b>PONUDA:</b> ${esc(o.no||"")}</div>
        <div><b>DATUM:</b> ${esc(o.date||"")}</div>
        <div><b>VRIJEDI DO:</b> ${esc(o.valid||"")}</div>
        <div><b>ODGOVORNA OSOBA:</b> ${esc(o.resp||"")}</div>
      </div>
    </div>
    <div class="report-title">${esc(o.title||"PRIJEDLOG RADOVA U UREĐENJU OKOLIŠA")}</div>
    ${sectionsHtml}
    <div class="summary-wrap">
      <div class="summary-left">
        <div class="line">Suma svih troškova prema grupama radova nalazi se iznad.</div>
        <div class="line">Iznosi su iskazani u EUR i bez PDV-a, osim gdje je drugačije navedeno.</div>
      </div>
      <div class="summary-box">
        ${vatRows}
        <div class="summary-row total"><span>UKUPNO OSNOVICA (EUR):</span><b>${E(total)}</b></div>
        <div class="summary-row total"><span>UKUPNO PDV (EUR):</span><b>${E(vatTotal)}</b></div>
        <div class="summary-row grand"><span>SVEUKUPNO (EUR):</span><b>${E(total+vatTotal)}</b></div>
      </div>
    </div>
    <div class="footer">
      <div>
        <strong>PLANT OLIVE d.o.o</strong><br>
        Put Devinke 8<br>23000, Briševo<br>Zadar, Croatia<br>OIB: HR17766224291
      </div>
      <div class="footer-right">
        <strong>IBAN (EUR)</strong><br>
        RAIFFEISENBANK AUSTRIA d.d.<br>
        HR5524840081135346626
      </div>
    </div>
    <div class="page-note">Plant Olive — Offer</div>
  </div>`;
}
